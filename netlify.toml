[build]
  publish = "app/dist"
  command = "npm run build"
  functions = "netlify/functions"

# Netlify Server (netlify/server/index.ts) needs Node 24; the build, the
# functions and the server all run on this major.
[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  # sharp (lib/art.ts, lib/static-map.ts) ships native code, so it isn't bundled.
  external_node_modules = ["sharp"]

[dev]
  command = "npm run dev:app"
  targetPort = 5173
  port = 8888
  publish = "app/dist"
  framework = "#custom"

# The app's headers. Each device's key sits in the browser, so the policy
# keeps script to Athena's own files: a page that ever showed text as markup
# still couldn't run it.
#  - script-src: the app's own files; the appearance script index.html inlines
#    before first paint, by its hash (app/src/lib/appearance-boot.ts: change
#    it and app/src/lib/headers.test.ts gives the new hash); blob: for Talk's
#    audio worklet (app/src/talk/mic.ts).
#  - frame-src: rich-link players load only from these hosts (lib/embeds.ts
#    EMBED_FRAME_HOSTS), after a tap. 'self' and blob: keep the attachment
#    viewer's PDF frame working.
#  - frame-ancestors / X-Frame-Options: only Athena may frame Athena.
# Content-Security-Policy-Report-Only is the fuller policy (images, media,
# connections, styles) being tried before it's enforced: what it would block
# shows in the browser's console.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "script-src 'self' 'sha256-fLCF74TGArJWzJ6ZQV4rn0WtNLQ0FKjDCV4knFZ7aus=' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; frame-src 'self' blob: https://www.youtube-nocookie.com https://player.vimeo.com https://www.loom.com https://open.spotify.com https://embed.music.apple.com https://embed.figma.com https://*.framer.website https://*.framer.app"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'sha256-fLCF74TGArJWzJ6ZQV4rn0WtNLQ0FKjDCV4knFZ7aus=' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self' wss://api.elevenlabs.io; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; frame-src 'self' blob: https://www.youtube-nocookie.com https://player.vimeo.com https://www.loom.com https://open.spotify.com https://embed.music.apple.com https://embed.figma.com https://*.framer.website https://*.framer.app"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)"

# The app routes by hash (/#/days/...), so every deep link is "/", a static
# file. The old catch-all (/* -> /index.html) is gone: a rule that matches
# every path is applied before Netlify Server and would take its requests.
# Only the share target still needs the shell.
[[redirects]]
  from = "/share-target"
  to = "/index.html"
  status = 200

# The "Deploy to Netlify" button (README) asks for these when someone sets up
# their own copy. The values here are only the labels shown beside each box.
# ATHENA_DATA_KEY isn't here on purpose: it must be set for production only,
# so deploy previews can't read their copy of the database (README step 2).
[template.environment]
  SITE_PASSWORD = "The password you'll type to open your Athena (choose your own)"
  SESSION_SECRET = "64 random hex characters: openssl rand -hex 32"
  MCP_BEARER_TOKEN = "Your master token, 64 random hex characters: openssl rand -hex 32"
  CONNECTOR_ENCRYPTION_KEY = "Seals your account sign-ins, 64 random hex characters: openssl rand -hex 32"
