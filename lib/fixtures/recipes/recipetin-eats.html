.com%2Ftachyon%2F2024%2F06%2Favatar-guest-temp-cache-bust-duplicate.png&r=g", "contentUrl": "https://secure.gravatar.com/avatar/ab56c26f582af73f73ceb2eebda7b7c66492a187dd1815cea57191f970ec67a3?s=96&d=https%3A%2F%2Fwww.recipetineats.com%2Ftachyon%2F2024%2F06%2Favatar-guest-temp-cache-bust-duplicate.png&r=g", "caption": "Chef JB (RecipeTin)"}, "sameAs": ["https://www.recipetineats.com/chef-jean-baptiste-alexandre/"], "url": "https://www.recipetineats.com/author/jb/"}, {"@type": "Recipe", "name": "JB's Chicken Chasseur", "author": {"@id": "https://www.recipetineats.com/#/schema/person/70765dc2e52fcc4e8c619f6b92a20bbc"}, "description": "Recipe video above. Chicken Chasseur (chasseur is French for “hunter”) is a classic French dish made with pieces of chicken cooked in a rich mushroom and tomato sauce with a gentle touch of brandy, finished with fresh tarragon. It’s rustic and cosy, and it was the first recipe I learned to master at cooking school back in France. - JB", "datePublished": "2025-10-10T16:00:00+00:00", "image": ["https://www.recipetineats.com/tachyon/2025/10/Chicken-Chasseur-JB_7.jpg", "https://www.recipetineats.com/tachyon/2025/10/Chicken-Chasseur-JB_7.jpg?resize=500%2C500", "https://www.recipetineats.com/tachyon/2025/10/Chicken-Chasseur-JB_7.jpg?resize=500%2C375", "https://www.recipetineats.com/tachyon/2025/10/Chicken-Chasseur-JB_7.jpg?resize=480%2C270"], "recipeYield": ["4"], "prepTime": "PT15M", "cookTime": "PT45M", "totalTime": "PT60M", "recipeIngredient": ["4  chicken thighs, bone-in, skin on ((~250g/8oz each) (Note 1))", "4  chicken drumsticks ((Note 1))", "3/4 tsp cooking salt / kosher salt", "1/2 tsp black pepper", "3 tbsp plain flour ((all-purpose flour))", "2 tbsp vegetable oil ((or any other neutral flavoured oil))", "30g / 2 tbsp  unsalted butter", "400g / 14oz  white mushrooms (, sliced 6mm/0.2”)", "2  onions (, brown or yellow, halved then sliced 6mm/0.2” thick)", "3  garlic cloves (, finely minced)", "1/4 cup brandy ((Note 2))", "1/2 cup chardonnay or other dry white wine ((Note 3))", "3 tbsp tomato paste", "2 1/2 cups beef stock (, low-sodium (note 4))", "3/4 tsp cooking salt/kosher salt", "1/4 tsp black pepper", "30g / 2 tbsp  unsalted butter (, COLD and cubed (KEEP REFRIGERATED until required) )", "1 tbsp fresh tarragon (, finely chopped (Note 5))", "Creamy mashed potato ((or rice or small pasta))"], "recipeInstructions": [{"@type": "HowToSection", "name": "Abbreviated Recipe", "itemListElement": [{"@type": "HowToStep", "text": "Season and flour the chicken, then brown in oil and butter. Remove. Sauté mushrooms and onion, add garlic briefly, then pour in brandy and wine to reduce. Stir in tomato paste for 1 minute, then stock, salt, and pepper. Return chicken, simmer covered 10 minutes then uncovered for 20 minutes until tender. Finish with cold butter and fresh tarragon.", "name": "Season and flour the chicken, then brown in oil and butter. Remove. Sauté mushrooms and onion, add garlic briefly, then pour in brandy and wine to reduce. Stir in tomato paste for 1 minute, then stock, salt, and pepper. Return chicken, simmer covered 10 minutes then uncovered for 20 minutes until tender. Finish with cold butter and fresh tarragon.", "url": "https://www.recipetineats.com/chicken-chasseur/#wprm-recipe-187046-step-0-0"}]}, {"@type": "HowToSection", "name": "Chicken", "itemListElement": [{"@type": "HowToStep", "text": "Season the chicken - Pat the chicken dry thoroughly with paper towels. This removes surface moisture, allowing the skin to brown properly and avoiding splatter. Season with salt and pepper on all sides. Coat in flour, shaking off excess. This helps develop a golden crust and also thickens the sauce later.", "name": "Season the chicken - Pat the chicken dry thoroughly with paper towels. This removes surface moisture, allowing the skin to brown properly and avoiding splatter. Season with salt and pepper on all sides. Coat in flour, shaking off excess. This helps develop a golden crust and also thickens the sauce later.", "url": "https://www.recipetineats.com/chicken-chasseur/#wprm-recipe-187046-step-1-0"}, {"@type": "HowToStep", "text": "Brown the Chicken - Heat vegetable oil in a large (30cm/12&quot;) skillet (with lid) over medium-high heat. Add butter, once melted and foaming, place thighs skin-side down. Sear for 5 minutes until golden and crispy. Flip and cook the other side for 1 minute. Transfer to a plate. Add the drumsticks and brown them on 3 sides, about 2 minutes per side. Don’t rush this step – browning adds depth of flavour. Transfer drumsticks to the plate with the thighs. ⚠️ Be mindful when searing skin-on chicken pieces, the skin can pop and hot oil may splash.", "name": "Brown the Chicken - Heat vegetable oil in a large (30cm/12&quot;) skillet (with lid) over medium-high heat. Add butter, once melted and foaming, place thighs skin-side down. Sear for 5 minutes until golden and crispy. Flip and cook the other side for 1 minute. Transfer to a plate. Add the drumsticks and brown them on 3 sides, about 2 minutes per side. Don’t rush this step – browning adds depth of flavour. Transfer drumsticks to the plate with the thighs. ⚠️ Be mindful when searing skin-on chicken pieces, the skin can pop and hot oil may splash.", "url": "https://www.recipetineats.com/chicken-chasseur/#wprm-recipe-187046-step-1-1"}]}, {"@type": "HowToSection", "name": "Chasseur Sauce", "itemListElement": [{"@type": "HowToStep", "text": "Onion, mushrooms and garlic - In the same pan, increase the heat to high and add the mushrooms and onions. Cook for 5 minutes, stirring occasionally, until the mushrooms start to wilt. Add the garlic and cook for 30 seconds until fragrant.", "name": "Onion, mushrooms and garlic - In the same pan, increase the heat to high and add the mushrooms and onions. Cook for 5 minutes, stirring occasionally, until the mushrooms start to wilt. Add the garlic and cook for 30 seconds until fragrant.", "url": "https://www.recipetineats.com/chicken-chasseur/#wprm-recipe-187046-step-2-0"}, {"@type": "HowToStep", "text": "Brandy and wine - Pour in the brandy. Carefully flambé (ignite) if desired - let it burn until the flame dies out by itself (~10 seconds). Flambéing intensifies the aroma - and puts on a show! Or simply let it bubble for 20–30 seconds until the alcohol burns off. Add the white wine. Let it simmer rapidly to reduce by half. Use a wooden spoon to scrape up the fond (the browned bits stuck to the bottom), which is a crucial ingredient to the creation of our sauce. It will make it rich and complex.", "name": "Brandy and wine - Pour in the brandy. Carefully flambé (ignite) if desired - let it burn until the flame dies out by itself (~10 seconds). Flambéing intensifies the aroma - and puts on a show! Or simply let it bubble for 20–30 seconds until the alcohol burns off. Add the white wine. Let it simmer rapidly to reduce by half. Use a wooden spoon to scrape up the fond (the browned bits stuck to the bottom), which is a crucial ingredient to the creation of our sauce. It will make it rich and complex.", "url": "https://www.recipetineats.com/chicken-chasseur/#wprm-recipe-187046-step-2-1"}, {"@type": "HowToStep", "text": "Tomato and stock -  Stir in the tomato paste, cook for 1 minute. Then add the stock, salt, and pepper.", "name": "Tomato and stock -  Stir in the tomato paste, cook for 1 minute. Then add the stock, salt, and pepper.", "url": "https://www.recipetineats.com/chicken-chasseur/#wprm-recipe-187046-step-2-2"}]}, {"@type": "HowToSection", "name": "Cooking", "itemListElement": [{"@type": "HowToStep", "text": "Simmer - Return the chicken to the pan skin-side up, nestling them into the stock. Bring the sauce to a simmer, then reduce the heat to medium (bubbling constantly but not rapidly). Cover with a lid and simmer for 10 minutes. Then remove the lid and simmer uncovered for a further 20 minutes. This allows the sauce to reduce and concentrate while the chicken finishes cooking.", "name": "Simmer - Return the chicken to the pan skin-side up, nestling them into the stock. Bring the sauce to a simmer, then reduce the heat to medium (bubbling constantly but not rapidly). Cover with a lid and simmer for 10 minutes. Then remove the lid and simmer uncovered for a further 20 minutes. This allows the sauce to reduce and concentrate while the chicken finishes cooking.", "url": "https://www.recipetineats.com/chicken-chasseur/#wprm-recipe-187046-step-3-0"}, {"@type": "HowToStep", "text": "Reduce sauce slightly - Transfer the cooked chicken to a plate. Turn the heat to medium-high, and simmer the sauce for 3 minutes to reduce slightly.", "name": "Reduce sauce slightly - Transfer the cooked chicken to a plate. Turn the heat to medium-high, and simmer the sauce for 3 minutes to reduce slightly.", "url": "https://www.recipetineats.com/chicken-chasseur/#wprm-recipe-187046-step-3-1"}, {"@type": "HowToStep", "text": "Finish the sauce - Turn off the heat. Scatter half of the COLD butter cubes in then stir until melted. Scatter the rest of the butter cubes in then stir again until melted. This is a classic emulsification technique that gives the sauce a silky, glossy finish (monter au beurre) as well as thickening it slightly. (Note 6)", "name": "Finish the sauce - Turn off the heat. Scatter half of the COLD butter cubes in then stir until melted. Scatter the rest of the butter cubes in then stir again until melted. This is a classic emulsification technique that gives the sauce a silky, glossy finish (monter au beurre) as well as thickening it slightly. (Note 6)", "url": "https://www.recipetineats.com/chicken-chasseur/#wprm-recipe-187046-step-3-2"}, {"@type": "HowToStep", "text": "Serve - Bring the sauce to a gentle simmer again. Return the chicken to the sauce and sprinkle over the fresh tarragon. Take it to the table and serve out of the pan with creamy mashed potato.", "name": "Serve - Bring the sauce to a gentle simmer again. Return the chicken to the sauce and sprinkle over the fresh tarragon. Take it to the table and serve out of the pan with creamy mashed potato.", "url": "https://www.recipetineats.com/chicken-chasseur/#wprm-recipe-187046-step-3-3"}]}], "aggregateRating": {"@type": "AggregateRating", "ratingValue": "5", "ratingCount": "122", "reviewCount": "5"}, "recipeCategory": ["Main"], "recipeCuisine": ["French"], "keywords": "chicken chasseur, french hunter's chicken, poulet chasseur", "nutrition": {"@type": "NutritionInformation", "calories": "854 kcal", "carbohydrateContent": "18 g", "proteinContent": "53 g", "fatContent": "57 g", "saturatedFatContent": "18 g", "transFatContent": "1 g", "cholesterolContent": "291 mg", "sodiumContent": "1489 mg", "fiberContent": "3 g", "sugarContent": "6 g", "unsaturatedFatContent": "34 g", "servingSize": "1 serving"}, "@id": "https://www.recipetineats.com/chicken-chasseur/#recipe", "isPartOf": {"@id": "https://www.recipetineats.com/chicken-chasseur/#article"}, "mainEntityOfPage": "https://www.recipetineats.com/chicken-chasseur/"}]}</script>
