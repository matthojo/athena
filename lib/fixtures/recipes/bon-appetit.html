<script type="application/ld+json">{"@context":"http://schema.org","@type":"Recipe","articleBody":"Chris Morocco spent months developing this chocolate chip cookie recipe—testing at least 30 batches, then cross-testing the final version 10 more times—to land on his ideal: thin cookies with crisp, rippled edges, soft, chewy centers, and plenty of melted chocolate. The result is a deeply caramelized take on the classic Toll House version, with a texture that only gets better as it cools.\nBrowning some of the butter adds nutty depth, while a high proportion of dark brown sugar and extra egg yolks give the cookies their richness and signature chew. Chopped bittersweet chocolate creates pockets of melted chocolate throughout. And because the butter is melted, there’s no need for a mixer. Best of all, there’s no overnight rest; just give the dough a few minutes to hydrate before scooping.\nChocolate chip cookie FAQ","alternativeHeadline":"Crisp edges, chewy centers, and puddles of melted chocolate make these classic chocolate chip cookies a favorite. Brown butter gives them rich, nutty flavor.","keywords":["baking","dessert","cookie","chocolate","snack","christmas","easy","ba’s best","web"],"thumbnailUrl":"https://assets.bonappetit.com/photos/5ca534485e96521ff23b382b/1:1/w_2700,h_2700,c_limit/chocolate-chip-cookie.jpg","publisher":{"@context":"https://schema.org","@type":"Organization","name":"Bon Appétit","logo":{"@type":"ImageObject","url":"https://www.bonappetit.com/verso/static/bonappetit-us/assets/logo-seo.png","width":"479px","height":"100px"},"url":"https://www.bonappetit.com"},"isPartOf":{"@type":"CreativeWork","name":"Bon Appétit"},"isAccessibleForFree":true,"author":[{"@type":"Person","name":"Chris Morocco","sameAs":"https://www.bonappetit.com/contributor/chris-morocco"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":4.5,"ratingCount":1441},"description":"Crisp edges, chewy centers, and puddles of melted chocolate make these classic chocolate chip cookies a favorite. Brown butter gives them rich, nutty flavor.","image":["https://assets.bonappetit.com/photos/5ca534485e96521ff23b382b/16:9/w_4800,h_2700,c_limit/chocolate-chip-cookie.jpg","https://assets.bonappetit.com/photos/5ca534485e96521ff23b382b/4:3/w_3600,h_2700,c_limit/chocolate-chip-cookie.jpg","https://assets.bonappetit.com/photos/5ca534485e96521ff23b382b/1:1/w_2700,h_2700,c_limit/chocolate-chip-cookie.jpg"],"inLanguage":"en-US","headline":"BA’s Best Chocolate Chip Cookies","name":"BA’s Best Chocolate Chip Cookies","cookTime":"20 minutes","recipeIngredient":["1½ cups plus 1 Tbsp. (200 g) all-purpose flour (spooning into measuring cups, then leveling)","1¼ tsp. (4 g) Diamond Crystal or ¾ tsp. (4 g) Morton kosher salt","¾ tsp. (4 g) baking soda","¾ cup (1½ sticks; 169 g) unsalted butter, divided","1 cup (200 g) (packed) dark brown sugar","¼ cup (50 g) granulated sugar","1 large egg","2 large egg yolks","2 tsp. vanilla extract","6 oz. (170 g) bittersweet chocolate (60%–70% cacao), coarsely chopped, or semisweet chocolate chips"],"recipeInstructions":[{"@type":"HowToStep","text":"Place racks in upper and lower thirds of oven; preheat to 375°. Whisk 1½ cups plus 1 Tbsp. (200 g) all-purpose flour, 1¼ tsp. (4 g) Diamond Crystal or ¾ tsp. (4 g) Morton kosher salt, and ¾ tsp. (4 g) baking soda in a small bowl; set flour mixture aside."},{"@type":"HowToStep","text":"Cook ½ cup (1 stick; 113 g) unsalted butter in a large saucepan over medium heat, swirling often and scraping bottom of pan with a heatproof rubber spatula, until butter foams, then browns, about 4 minutes. Scrape melted butter and any brown bits to a large heatproof mixing bowl and let cool 1 minute. Cut remaining ¼ cup (½ stick; 56 g) unsalted butter into small pieces and add to brown butter (it should start to melt but not foam and sizzle, so test with one piece before adding the rest)."},{"@type":"HowToStep","text":"Once butter is melted, add 1 cup (200 g) (packed) dark brown sugar and ¼ cup (50 g) granulated sugar and whisk, breaking up any clumps, until sugar is incorporated and no lumps remain. Add 1 large egg and 2 large egg yolks and whisk until sugar dissolves and mixture is smooth, about 30 seconds. Whisk in 2 tsp. vanilla extract. Using rubber spatula, fold reserved dry ingredients into butter mixture just until no dry spots remain, then fold in 6 oz. (170 g) bittersweet chocolate (60%–70% cacao), coarsely chopped, or semisweet chocolate chips (the cookie dough will be soft but should hold its shape once scooped; if it slumps or oozes after being scooped, stir dough back together several times and let rest 5–10 minutes until scoops hold their shape as the flour hydrates)."},{"@type":"HowToStep","text":"Using a 1½-oz. scoop (3 Tbsp.), portion out 16 balls of dough and divide between 2 parchment-paper-lined rimmed baking sheets. Bake cookies, rotating sheets if cookies are browning very unevenly (otherwise, just leave them alone), until deep golden brown and firm around the edges, 8–10 minutes. Let cool on baking sheets.\nDo Ahead: Dough balls can be portioned 3 months ahead; freeze on cookie sheets and then transfer to a resealable plastic bag. Bake from frozen, adding 1–2 minutes onto the cook time. Cookies can be baked 3 days ahead. Store in an airtight container at room temperature.\nEditor’s note: This recipe was first published in April 2019; it has been updated for style. Head this way for 31 of our easiest cookie recipes →"}],"totalTime":"40 minutes","recipeYield":"Makes 16","url":"https://www.bonappetit.com/recipe/bas-best-chocolate-chip-cookies","dateModified":"2026-10-13T10:54:11.515-04:00","datePublished":"2019-04-25T06:00:00.000-04:00"}</script>
