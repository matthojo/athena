<script data-testid="page-schema" type="application/ld+json">{"@context":"https://schema.org","@id":"https://www.bbcgoodfood.com/recipes/chicken-leek-pie#Recipe","@type":"Recipe","description":"Make our comforting chicken and leek pie with a flaky puff pastry crust. Bursting with seasonal flavours, this easy pie recipe is perfect for entertaining.","image":[{"@type":"ImageObject","url":"https://images.immediate.co.uk/production/volatile/sites/30/2009/10/Chicken-leek-pie-fb356b2.jpg?resize=440,400","width":440,"height":400}],"mainEntityOfPage":{"@type":"WebPage","@id":"https://www.bbcgoodfood.com/recipes/chicken-leek-pie"},"name":"Chicken & leek pie","url":"https://www.bbcgoodfood.com/recipes/chicken-leek-pie","author":[{"@type":"Person","name":"Mary Cadogan","url":"https://www.bbcgoodfood.com/author/marycadogan"}],"dateModified":"2026-08-31T22:07:54+01:00","datePublished":"2009-10-06T11:06:53+01:00","headline":"Chicken & leek pie","keywords":"Bacon, Celery, Chicken, Comfort Food, Corn-fed chicken, Crème fraîche, Good Food, Leek, Leeks, Make ahead, Mustard, PASTRY, Pie, Puff pastry","publisher":{"@type":"Organization","name":"Good Food","url":"https://www.bbcgoodfood.com","logo":{"@type":"ImageObject","height":325,"url":"https://images.immediate.co.uk/production/volatile/sites/30/2026/02/goodfood.logo-f37096c.png?resize=1312,325","width":1312}},"nutrition":{"@type":"NutritionInformation","calories":"762 calories","fatContent":"49 grams fat","saturatedFatContent":"24 grams saturated fat","carbohydrateContent":"27 grams carbohydrates","fiberContent":"2 grams fiber","proteinContent":"55 grams protein","sodiumContent":"2.78 milligram of sodium"},"recipeCategory":"Dinner, Lunch, Main course, Supper","recipeCuisine":"British","recipeIngredient":["1 ½kg whole corn-fed chicken","½ tsp peppercorns","2 bay leaves","3-4 thyme sprigs","1 onion halved","1 celery stick","4 large or medium eggs","25g butter","2 tbsp olive oil","6 bacon rashers, cut into large pieces","2 leeks thinly sliced","2 tbsp plain flour thinly sliced","2 tbsp grainy mustard","4 tbsp crème fraîche","4 tbsp chopped fresh parsley","squeeze of lemon juice","250g bought puff pastry or home-made rough puff","250g beaten egg for glazing"],"recipeInstructions":[{"@type":"HowToStep","text":"Put the chicken into a deep pan that is just large enough to hold it quite snugly. Pour in enough water to half-cover the bird, then tip in the peppercorns, bay leaves, thyme, onion and celery. Add ½ tsp salt and bring to the boil on the hob, then reduce the heat, cover tightly and simmer for 1 hr-1 hr 15 until tender."},{"@type":"HowToStep","text":"Transfer the chicken to a plate. Strain 425ml of the stock into a measuring jug (top up with water if you need to). Strip the meat off the chicken, cut into bite-sized pieces and put in a 1.7-litre pie dish."},{"@type":"HowToStep","text":"Put the eggs in boiling water and boil for 6 minutes. Drain, cool them under cold water and remove the shells. Quarter the eggs and nestle them in the pie dish among the chicken pieces."},{"@type":"HowToStep","text":"Heat the butter and oil in a large frying pan and fry the bacon until crisp. Add the leeks and cook for 2 minutes until softened. Stir in the flour and cook for 1 minute. Pour in the chicken stock a third at a time, stirring continuously and making sure the sauce is thick and smooth before adding the next batch. Stir in the mustard, crème fraîche and parsley, then add a squeeze of lemon juice and black pepper to taste. Add salt if needed. Spoon over the chicken and leave to cool."},{"@type":"HowToStep","text":"Meanwhile, preheat the oven to 220C/200C fan/gas 7. Reserve a quarter of the pastry for decoration and roll out the remainder to a shape about 5cm larger than the top of the pie dish, then cut a 2.5cm strip from all round the edge. Brush the edge of the dish with water and stick the pastry strip to it. Brush the strip with water. Flip the pastry lid over the rolling pin, lift it up and unroll over the pie. Press the edge on to the pastry strip to seal, and trim any excess with a sharp knife."},{"@type":"HowToStep","text":"Tap the blade of a small sharp knife all along the outside edge of the pastry (this helps the edge to rise during cooking), then flute it using the back of the knife. Make a hole in the lid centre with the tip of the knife, to allow steam to escape as the pie bakes."},{"@type":"HowToStep","text":"Roll out the pastry you put aside earlier. Cut 8 long strips each about 1cm wide, and two more strips each about 4cm wide. Cut the wider strips diagonally to make eight diamond leaf shapes. Mark the veins of the leaves with the tip of a sharp knife. Brush the pastry lid with beaten egg, then lay the eight thin strips on top, as in the picture. Brush again with egg and arrange the leaves in the centre, between the strips. Brush with egg."},{"@type":"HowToStep","text":"Chill the pie for 15 mins, if you have time, to set the pastry. Will keep in the fridge for one day – just add 4-5 mins to baking time. Bake for 30-35 mins until the pastry is crisp, puffed up and deep golden brown."}],"recipeYield":6,"totalTime":"PT3H"}</script>
