<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Athena</title>
    <meta name="description" content="Athena is your second brain: notes, people and the week at a glance, in one calm place." />

    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/funnel-display-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <!-- --canvas in each scheme. The script below gives both the chosen scheme's colour (src/lib/appearance.ts). -->
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" data-light="#f4f6f8" data-dark="#0c0e13" />
    <meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)" data-light="#f4f6f8" data-dark="#0c0e13" />
    <meta name="color-scheme" content="light dark" />
    <!-- appearance: first paint -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Athena" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/charts.css" />
    <link rel="stylesheet" href="/src/styles/fields.css" />
    <link rel="stylesheet" href="/src/styles/nav.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
