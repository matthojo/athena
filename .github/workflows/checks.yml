name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only permissive licences in what ships (CONTRIBUTING.md, "Only permissive code from elsewhere").
      - name: Dependency licences
        run: npm run check:licences
      - run: npm run typecheck
      # Database tests (*.db.test.ts) skip themselves without ATHENA_TEST_DB_URL.
      - run: npm test
      - run: npm run build
      - name: Landing page
        run: npm run site:build
      - name: Browser extension tests
        working-directory: extension
        run: npm test

  migrations:
    name: Released migrations unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Every copy of Athena applies netlify/database/migrations in order, and
      # Netlify refuses a deploy whose applied migrations were edited or
      # removed. So a pull request may add migrations, never change one.
      - name: Only new migration files
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-status --diff-filter=DMRT "origin/$BASE...HEAD" -- netlify/database/migrations)"
          if [ -n "$changed" ]; then
            echo "::error::A released migration was edited, renamed or removed. Add a new migration instead (CONTRIBUTING.md):"
            echo "$changed"
            exit 1
          fi

  secrets:
    name: No secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
