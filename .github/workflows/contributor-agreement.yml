name: Contributor agreement

# Checks that everyone who wrote commits in a pull request has agreed to
# CONTRIBUTOR_AGREEMENT.md, and sets a "Contributor agreement" status on it.
# Someone agrees by commenting the sentence in that file's "How to agree"
# section. Each agreement is recorded (GitHub account, time, link to the
# comment) on the contributor-agreements branch, so it's asked for once.
#
# It never checks out or runs the pull request's code, which is what makes
# pull_request_target safe here. Runs only in Athena's own repository.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write # the record, on the contributor-agreements branch
  issues: write # the comment that explains how to agree
  pull-requests: write
  statuses: write

concurrency:
  group: contributor-agreement-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  check:
    if: >-
      github.repository == 'matthojo/athena' &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request && contains(github.event.comment.body, 'Contributor Assignment Agreement')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const VERSION = "1.0";
            const SENTENCE = `I have read the Contributor Assignment Agreement (version ${VERSION}) and I agree to it.`;
            const BRANCH = "contributor-agreements";
            const RECORD = `agreements/v${VERSION}.json`;
            const MARKER = "<!-- contributor-agreement -->";
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? context.payload.issue.number;
            const agreementUrl = `${context.serverUrl}/${owner}/${repo}/blob/main/CONTRIBUTOR_AGREEMENT.md`;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== "open") return;

            // The repository's owner holds the copyright already; bots don't author work.
            const exempt = (user) => user.type === "Bot" || user.login.endsWith("[bot]") || user.login === owner;

            // Everyone who must agree: the pull request's author, and each commit author
            // with a GitHub account. A commit with no linked account counts as the pull
            // request author's, and the agreement makes them answerable for it.
            const needed = new Map();
            const need = (user) => { if (user && !exempt(user)) needed.set(user.id, user.login); };
            need(pr.user);
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: number, per_page: 100 });
            for (const commit of commits) need(commit.author);

            // The record so far.
            async function readRecord() {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: RECORD, ref: BRANCH });
                return { sha: data.sha, entries: JSON.parse(Buffer.from(data.content, "base64").toString("utf8")) };
              } catch (error) {
                if (error.status === 404) return { sha: undefined, entries: [] };
                throw error;
              }
            }

            async function ensureBranch() {
              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${BRANCH}` });
                return;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const readme = "The record of who agreed to CONTRIBUTOR_AGREEMENT.md, kept by the Contributor agreement workflow. Don't edit or merge this branch.\n";
              const { data: blob } = await github.rest.git.createBlob({ owner, repo, content: readme, encoding: "utf-8" });
              const { data: tree } = await github.rest.git.createTree({ owner, repo, tree: [{ path: "README.md", mode: "100644", type: "blob", sha: blob.sha }] });
              const { data: commit } = await github.rest.git.createCommit({ owner, repo, message: "Start the contributor agreement record", tree: tree.sha, parents: [] });
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${BRANCH}`, sha: commit.sha });
              } catch (error) {
                if (error.status !== 422) throw error; // another run made it first
              }
            }

            async function addToRecord(additions) {
              await ensureBranch();
              for (let attempt = 1; attempt <= 5; attempt++) {
                const { sha, entries } = await readRecord();
                const known = new Set(entries.map((entry) => entry.user_id));
                const fresh = additions.filter((entry) => !known.has(entry.user_id));
                if (fresh.length === 0) return;
                const content = JSON.stringify([...entries, ...fresh], null, 2) + "\n";
                try {
                  await github.rest.repos.createOrUpdateFileContents({
                    owner, repo, branch: BRANCH, path: RECORD, sha,
                    message: "Record a contributor agreement",
                    content: Buffer.from(content).toString("base64"),
                  });
                  return;
                } catch (error) {
                  if (error.status !== 409 && error.status !== 422) throw error; // 409/422: another run wrote first
                  await new Promise((resolve) => setTimeout(resolve, 1000 * attempt));
                }
              }
              throw new Error("Couldn't write the agreement record after five tries.");
            }

            // Agreements made in this pull request's comments: the exact sentence on a line of its own.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const additions = [];
            for (const comment of comments) {
              if (!comment.user || exempt(comment.user)) continue;
              const agrees = (comment.body ?? "").split(/\r?\n/).some((line) => line.trim() === SENTENCE);
              if (!agrees) continue;
              additions.push({
                user_id: comment.user.id,
                login: comment.user.login,
                version: VERSION,
                agreed_at: comment.created_at,
                comment_url: comment.html_url,
              });
            }
            if (additions.length > 0) await addToRecord(additions);

            const { entries } = await readRecord();
            const agreed = new Set(entries.map((entry) => entry.user_id));
            const missing = [...needed].filter(([id]) => !agreed.has(id)).map(([, login]) => login);

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha,
              context: "Contributor agreement",
              state: missing.length === 0 ? "success" : "failure",
              description: (missing.length === 0 ? "Everyone has agreed" : `Waiting for ${missing.join(", ")}`).slice(0, 140),
              target_url: agreementUrl,
            });

            // One comment on the pull request, kept up to date.
            const body = missing.length === 0
              ? `${MARKER}\nThanks: everyone who wrote commits here has agreed to the [Contributor Assignment Agreement](${agreementUrl}).`
              : [
                  MARKER,
                  `Thanks for contributing. Before this can be merged, ${missing.map((login) => `@${login}`).join(", ")} ${missing.length === 1 ? "needs" : "need"} to agree to the [Contributor Assignment Agreement](${agreementUrl}).`,
                  "",
                  "It assigns the copyright in your contribution to the project's maintainer, with a licence back to you, so Athena can keep offering hosting and other licences in future. Versions already released stay under the AGPL.",
                  "",
                  "To agree, read it, then post a comment containing this line:",
                  "",
                  "```",
                  SENTENCE,
                  "```",
                  "",
                  "You only need to do this once. A commit that isn't linked to a GitHub account counts as the pull request author's.",
                ].join("\n");
            const existing = comments.find((comment) => comment.user?.type === "Bot" && (comment.body ?? "").startsWith(MARKER));
            if (existing) {
              if (existing.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else if (missing.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
