name: Website

# Builds Athena's landing page (scripts/build-site.ts) from README.md and
# publishes it to GitHub Pages. The documentation lives on the Community site. Runs only in Athena's own repository,
# so copies of Athena never publish a site. Pages must be set to deploy from
# GitHub Actions (Settings → Pages → Source).

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
      - package.json
      - lib/community-site.ts
      - site/**
      - scripts/build-site.ts
      - app/src/styles/tokens.css
      - app/public/fonts/**
      - app/public/icons/**
      - .github/readme/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'matthojo/athena'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
