name: Website

# Builds Athena's landing page (scripts/build-site.ts) from README.md and
# publishes it to GitHub Pages. The documentation lives on the Community site. Runs only in Athena's own repository,
# so copies of Athena never publish a site. Pages must be set to deploy from
# GitHub Actions (Settings → Pages → Source).

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
      - package.json
      - lib/community-site.ts
      - site/**
      - scripts/build-site.ts
      - app/src/styles/tokens.css
      - app/public/fonts/**
      - app/public/icons/**
      - .github/readme/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'matthojo/athena'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run site:build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
